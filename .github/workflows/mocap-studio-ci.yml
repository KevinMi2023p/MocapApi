name: Mocap Studio CI

on:
  pull_request:
    paths:
      - "install.sh"
      - "studio/**"
      - ".github/workflows/mocap-studio-*.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "install.sh"
      - "studio/**"
      - ".github/workflows/mocap-studio-*.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio/frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --passWithNoTests
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - run: npm run build
      - name: Verify generated runtime notices
        working-directory: .
        run: python3 studio/packaging/generate_third_party_notices.py --check
      - name: Verify version declarations
        working-directory: .
        run: python3 studio/packaging/check_versions.py

  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library backend tests
        env:
          PYTHONPATH: studio/backend
        run: python -m unittest discover -s studio/backend/tests -p "test_*.py" -v

  bundle:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-x86_64
          - linux-aarch64
          - darwin-x86_64
          - darwin-arm64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json
      - run: npm ci
        working-directory: studio/frontend
      - run: npm run lint
        working-directory: studio/frontend
      - run: npm run build
        working-directory: studio/frontend
      - name: Prove deterministic tar assembly from identical prebuilt inputs
        env:
          SOURCE_DATE_EPOCH: "0"
        run: |
          python3 studio/packaging/build_release.py --version 0.1.0 --target "${{ matrix.target }}" --output-dir dist-a
          python3 studio/packaging/build_release.py --version 0.1.0 --target "${{ matrix.target }}" --output-dir dist-b
          cmp "dist-a/mocap-studio-0.1.0-${{ matrix.target }}.tar.gz" "dist-b/mocap-studio-0.1.0-${{ matrix.target }}.tar.gz"
      - name: Verify source-isolated payload
        run: |
          tar -tzf "dist-a/mocap-studio-0.1.0-${{ matrix.target }}.tar.gz" > archive.list
          ! grep -E '/(bin/(linux|win32|android)|lib/|include/|demo/|doc/)' archive.list
          grep -q '/backend/mocap_studio/static/index.html$' archive.list
          grep -q '/desktop/desktop_integration.py$' archive.list
          grep -q '/desktop/mocap-studio.svg$' archive.list

  linux-installer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
      - run: npm ci
        working-directory: studio/frontend
      - run: npm run build
        working-directory: studio/frontend
      - name: Exercise PATH setup, install, health, and uninstall preservation
        run: studio/packaging/smoke_installer.sh

  macos-installer-smoke:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: studio/frontend
      - run: npm run build
        working-directory: studio/frontend
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Exercise safe extraction, install, health, and uninstall preservation
        run: studio/packaging/smoke_installer.sh
