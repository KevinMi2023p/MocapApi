name: Mocap Studio Release

on:
  push:
    tags:
      - "studio-v*"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-x86_64
          - linux-aarch64
          - darwin-x86_64
          - darwin-arm64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: studio/frontend
      - run: npm run lint
        working-directory: studio/frontend
      - run: npm test -- --passWithNoTests
        working-directory: studio/frontend
      - run: npm run build
        working-directory: studio/frontend
      - name: Verify generated runtime notices
        run: python3 studio/packaging/generate_third_party_notices.py --check
      - name: Test backend
        env:
          PYTHONPATH: studio/backend
        run: python -m unittest discover -s studio/backend/tests -p "test_*.py" -v
      - name: Validate tag and build archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#studio-v}"
          python3 studio/packaging/check_versions.py --expected "$version"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python3 studio/packaging/build_release.py --version "$version" --target "${{ matrix.target }}" --output-dir dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mocap-studio-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: bundle
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mocap-studio-*
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#studio-v}"
          gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --generate-notes --title "Mocap Studio $version"
